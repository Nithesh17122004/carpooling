<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#635bff" />
  <meta name="description" content="RideMate — share rides, split costs, travel together." />
  <title>RideMate — Share rides, travel together</title>
  <link rel="icon" type="image/png" href="assets/icon/app_icon.png" />

  <script>
    // Dev convenience: talk to the Flask API on :5000 when the UI runs on a static port.
    window.RIDEMATE_API = window.RIDEMATE_API || (/^(5500|8000|8080|5173)$/.test(location.port) ? 'http://localhost:5000' : '');

    // No credentials are ever hardcoded in this file. The Google public client
    // ID is fetched at runtime from GET /api/auth/providers; the client SECRET
    // never leaves the server. A deployment may override window.RIDEMATE_API or
    // window.RIDEMATE_GOOGLE_CLIENT_ID via a config.js loaded before app.js, but
    // neither is required and no value is committed here.
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- Splash -->
  <div id="splash" class="splash">
    <div class="splash__logo" aria-hidden="true"></div>
    <div class="splash__bar"><i></i></div>
  </div>

  <!-- Authenticated app shell -->
  <div id="appShell" class="app hidden">
    <aside class="sidebar" id="sidebar">
      <a href="#/discover" class="brand">
        <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 11.2 6.7 6.8A2 2 0 0 1 8.6 5.4h6.8a2 2 0 0 1 1.9 1.4l1.5 4.4"/><path d="M3.6 11.4h16.8v4.4h-1.9a2 2 0 0 1-4 0H9.5a2 2 0 0 1-4 0H3.6z"/><circle cx="7.4" cy="15.9" r=".9"/><circle cx="16.6" cy="15.9" r=".9"/></svg></span>
        <span class="brand__name">ride<i>mate</i></span>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <a href="#/publish" class="btn btn-primary btn-block btn-lg side-cta" data-nav="publish">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg> Publish a ride
      </a>
      <div class="side-user">
        <div class="avatar avatar--lg" id="sideAvatar"></div>
        <div class="side-user__meta">
          <strong id="sideUserName">—</strong>
          <span id="sideUserEmail">—</span>
        </div>
        <button class="btn-icon btn-icon--ghost" id="logoutBtn" title="Log out" aria-label="Log out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg></button>
      </div>
    </aside>

    <div class="topbar">
      <a href="#/discover" class="brand brand--top">
        <span class="brand__mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5.2 11.2 6.7 6.8A2 2 0 0 1 8.6 5.4h6.8a2 2 0 0 1 1.9 1.4l1.5 4.4"/><path d="M3.6 11.4h16.8v4.4h-1.9a2 2 0 0 1-4 0H9.5a2 2 0 0 1-4 0H3.6z"/><circle cx="7.4" cy="15.9" r=".9"/><circle cx="16.6" cy="15.9" r=".9"/></svg></span>
        <span class="brand__name">ride<i>mate</i></span>
      </a>
      <div class="topbar__actions">
        <a href="#/publish" class="btn btn-primary btn-sm" data-nav="publish">+ Publish</a>
        <a href="#/profile" class="avatar avatar--sm" id="topAvatar"></a>
      </div>
    </div>

    <main class="main" id="main">
      <div id="view" class="view"></div>
    </main>

    <nav class="bottomnav" id="bottomnav"></nav>
  </div>

  <!-- Unauthenticated root -->
  <div id="authRoot"></div>

  <!-- Overlays -->
  <div id="toastRoot" class="toast-root" aria-live="polite"></div>
  <div id="modalRoot"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
