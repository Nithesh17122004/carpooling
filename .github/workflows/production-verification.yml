name: Production verification

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "hardening/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --pull -t ridemate:ci .

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      MONGO_URI: mongodb://localhost:27017
      MONGO_DB_NAME: ridemate_browser_ci
      FLASK_ENV: development
      SECRET_KEY: browser-ci-only-secret
      JWT_SECRET: browser-ci-only-jwt-secret
      PAYMENT_PROVIDER: demo
      REDIS_URL: ""
      PORT: "5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend dependencies and browser runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Start RideMate
        shell: bash
        run: |
          set -euo pipefail
          python -m backend.app > /tmp/ridemate.log 2>&1 &
          echo $! > /tmp/ridemate.pid
          for i in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:5000/api/ready >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/ridemate.log
          exit 1
      - name: Run browser smoke checks
        run: python scripts/browser_smoke.py
      - name: Show server logs on failure
        if: failure()
        run: cat /tmp/ridemate.log
